# Security and resource override for the pinned upstream Firecrawl Compose file.
# No service receives the Docker socket. Only the API is published, on loopback.

x-security: &security
  cap_drop: !override
    - ALL
  security_opt: !override
    - no-new-privileges:true
  restart: unless-stopped

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
    compress: "true"

services:
  api:
    <<: *security
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      # The upstream defaults start five NuQ workers plus the API, queue,
      # extract, prefetch, and reconciler processes in this one container.
      # Keep concurrency modest on the 8 GiB HP server.
      NUQ_WORKER_COUNT: "1"
      NUM_WORKERS_PER_QUEUE: "1"
      CRAWL_CONCURRENT_REQUESTS: "2"
      MAX_CONCURRENT_JOBS: "2"
      BROWSER_POOL_SIZE: "2"
    ports: !override
      - "127.0.0.1:3002:3002"
    cpus: 1.5
    mem_limit: 2560m
    memswap_limit: 2560m
    pids_limit: 256
    logging: *bounded-logging

  playwright-service:
    <<: *security
    ports: !override []
    cpus: 1.0
    mem_limit: 1280m
    memswap_limit: 1280m
    pids_limit: 256
    logging: *bounded-logging

  redis:
    <<: *security
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 96
    logging: *bounded-logging

  rabbitmq:
    <<: *security
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 160
    logging: *bounded-logging

  nuq-postgres:
    <<: *security
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cpus: 0.5
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 160
    logging: *bounded-logging
